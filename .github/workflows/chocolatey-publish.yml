name: Publish to Chocolatey

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version must be numeric SemVer (for example, 0.1.0)"
            exit 1
          }
          $release = gh release view "v$env:VERSION" --repo ${{ github.repository }} --json tagName 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release v$env:VERSION not found"
            exit 1
          }
          Write-Host "Found release v$env:VERSION"

      - name: Get checksums from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$env:VERSION" --repo ${{ github.repository }} --pattern "checksums.txt" --dir .

          $checksums = Get-Content checksums.txt
          $x64Hash = ($checksums | Select-String "windows_amd64.zip").Line.Split()[0]
          $arm64Hash = ($checksums | Select-String "windows_arm64.zip").Line.Split()[0]

          Write-Host "x64 SHA256: $x64Hash"
          Write-Host "arm64 SHA256: $arm64Hash"

          echo "X64_HASH=$x64Hash" >> $env:GITHUB_ENV
          echo "ARM64_HASH=$arm64Hash" >> $env:GITHUB_ENV

      - name: Update version and checksums
        shell: pwsh
        run: |
          $version = $env:VERSION

          # Update version in nuspec
          $nuspec = 'packaging/chocolatey/salesforce-cli.nuspec'
          (Get-Content $nuspec) -replace '<version>0.0.0</version>', "<version>$version</version>" | Set-Content $nuspec
          Write-Host "Updated nuspec to version $version"

          # Inject checksums into install script
          $script = 'packaging/chocolatey/tools/chocolateyInstall.ps1'
          $content = Get-Content $script -Raw
          foreach ($placeholder in @('URL_AMD64_PLACEHOLDER', 'URL_ARM64_PLACEHOLDER', 'CHECKSUM_AMD64_PLACEHOLDER', 'CHECKSUM_ARM64_PLACEHOLDER')) {
            if (-not $content.Contains($placeholder)) {
              Write-Error "$script has no $placeholder"
              exit 1
            }
          }
          $urlAmd64 = "https://github.com/open-cli-collective/salesforce-cli/releases/download/v$version/sfdc_${version}_windows_amd64.zip"
          $urlArm64 = "https://github.com/open-cli-collective/salesforce-cli/releases/download/v$version/sfdc_${version}_windows_arm64.zip"
          $content = $content.Replace('URL_AMD64_PLACEHOLDER', $urlAmd64)
          $content = $content.Replace('URL_ARM64_PLACEHOLDER', $urlArm64)
          $content = $content -replace 'CHECKSUM_AMD64_PLACEHOLDER', $env:X64_HASH
          $content = $content -replace 'CHECKSUM_ARM64_PLACEHOLDER', $env:ARM64_HASH
          if ($content -match 'URL_(?:AMD64|ARM64)_PLACEHOLDER|CHECKSUM_(?:AMD64|ARM64)_PLACEHOLDER|ChocolateyPackageVersion|\$\{\s*version\s*\}') {
            Write-Error "$script still contains an unrendered URL/checksum placeholder or runtime package-version expression"
            exit 1
          }
          Set-Content $script $content
          Write-Host "Injected download URLs and checksums into install script"

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          cd packaging/chocolatey
          choco pack
          Get-ChildItem *.nupkg

      - name: Push to Chocolatey
        shell: pwsh
        run: |
          cd packaging/chocolatey
          choco push (Get-ChildItem *.nupkg).Name --source https://push.chocolatey.org/ --key ${{ secrets.CHOCOLATEY_API_KEY }}
