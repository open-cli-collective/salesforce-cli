name: Publish to Winget

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Submit WinGet package
        uses: open-cli-collective/.github/actions/winget-submit@6ee65fbc893f13b8876f013ec0661219a3e18269 # open-cli-collective/.github#52
        with:
          package-id: OpenCLICollective.salesforce-cli
          version: ${{ steps.version.outputs.version }}
          final-tag: ${{ env.RELEASE_TAG }}
          repo: ${{ github.repository }}
          bootstrap: "true"
          github-token: ${{ github.token }}
          winget-token: ${{ secrets.WINGET_GITHUB_TOKEN }}
